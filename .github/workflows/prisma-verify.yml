name: Prisma migration validation

on:
  push:
    branches: [prisma]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate local-only configuration
        run: npm run local:config
      - name: Verify Prisma schema
        run: npm run prisma:validate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Unit and source tests
        run: npm test

  postgres-integration:
    runs-on: ubuntu-latest
    needs: source-checks
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Explicitly generate Prisma Client for Next.js runtime
        run: |
          npm run prisma:generate
          test -f node_modules/.prisma/client/default.js
      - name: Create isolated environment and PostgreSQL
        run: |
          npm run local:config
          npm run db:setup
      - name: Prisma migration repeatability and privilege verification
        run: |
          npm run db:migrate
          npm run db:verify
      - name: Prisma schema validation
        run: npm run prisma:validate
      - name: PostgreSQL lifecycle and security integration
        id: sql_tests
        continue-on-error: true
        run: |
          node --env-file=.verification/m2.env --test --test-concurrency=1 \
            tests/application-lending.integration.mjs \
            tests/catalogue.integration.mjs \
            tests/hod-admin-governance.integration.mjs \
            tests/google-student-registration.integration.mjs \
            tests/hod-admin-reports.integration.mjs \
            tests/lending-authority.integration.mjs \
            tests/lending-lifecycle.integration.mjs \
            tests/lending-sources.integration.mjs \
            tests/officer-operations.integration.mjs \
            tests/physical-lifecycle.integration.mjs \
            tests/workflow-basic.integration.mjs
      - name: Isolate protected approval failure before retiring SQL functions
        id: approval_diagnostic
        continue-on-error: true
        run: node --env-file=.verification/m2.env tests/prisma-approval-diagnostic.integration.mjs
      - name: Authenticated HTTP workflow regression
        id: http_tests
        continue-on-error: true
        run: node --env-file=.verification/m2.env tests/workflow-run.integration.mjs
      - name: Assert all integration suites passed
        if: always()
        run: |
          test "${{ steps.sql_tests.outcome }}" = "success"
          test "${{ steps.http_tests.outcome }}" = "success"
      - name: Stop isolated database
        if: always()
        run: npm run db:down
