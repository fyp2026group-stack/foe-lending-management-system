name: Application source checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Generate ephemeral synthetic local-only config
        run: npm run local:config
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
