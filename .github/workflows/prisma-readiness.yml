name: Prisma migration readiness

on:
  push:
    branches: [prisma]
  pull_request:
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'scripts/prisma-readiness.mjs'
      - 'prisma7.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/prisma-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install reproducibly
        run: npm ci
      - name: Generate ephemeral local-only test configuration
        run: npm run local:config
      - name: Validate Prisma schema
        run: npm run prisma:validate
      - name: Generate Prisma client and typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build production application
        run: npm run build
      - name: Require complete native Prisma migration
        run: npm run prisma:readiness:enforce
