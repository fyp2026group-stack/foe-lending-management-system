name: Clean Prisma database HTTP lifecycle

on:
  push:
    branches: [prisma]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'tests/prisma-native-lifecycle-http.integration.mjs'
      - '.github/workflows/prisma-clean-http.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-http:
    name: Fresh database and real HTTP lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lab_m2_test_native
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lab_m2_test_native"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/lab_m2_test_native?schema=lab
      DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/lab_m2_test_native?schema=lab
      M2_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/lab_m2_test_native
      ORM_DATABASE_URL: postgresql://lab_orm:disposable-orm-ci-only@127.0.0.1:5432/lab_m2_test_native?schema=lab
      APP_ORIGIN: http://127.0.0.1:3000
      M2_TEST_APP_ORIGIN: http://127.0.0.1:3000
      M2_TEST_ENABLE: synthetic-only
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Generate Prisma Client and validate
        run: |
          npm run prisma:validate
          npm run typecheck
          npm run prisma:readiness:enforce
      - name: Deploy fresh Prisma-only schema
        run: |
          npx prisma migrate deploy --config prisma7.config.ts
          npx prisma migrate status --config prisma7.config.ts
      - name: Provision disposable ORM login
        run: |
          PGPASSWORD=disposable-ci-only psql -h 127.0.0.1 -U postgres -d lab_m2_test_native \
            -v ON_ERROR_STOP=1 -c "ALTER ROLE lab_orm LOGIN PASSWORD 'disposable-orm-ci-only'"
          PGPASSWORD=disposable-orm-ci-only psql -h 127.0.0.1 -U lab_orm -d lab_m2_test_native \
            -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM lab.inv_categories"
      - name: Run real HTTP request-approval-handover-return lifecycle
        run: |
          set -euo pipefail
          node node_modules/next/dist/bin/next dev --hostname 127.0.0.1 --port 3000 >/tmp/prisma-native-next.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 45); do
            if curl --silent --fail http://127.0.0.1:3000/login >/dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat /tmp/prisma-native-next.log; exit 1; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:3000/login >/dev/null
          node --test --test-concurrency=1 tests/prisma-native-lifecycle-http.integration.mjs tests/prisma-native-admin-report-http.integration.mjs
      - name: Verify balanced ledger and permissions
        if: success()
        run: |
          PGPASSWORD=disposable-ci-only psql -h 127.0.0.1 -U postgres -d lab_m2_test_native \
            -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM lab.inv_movements"
          PGPASSWORD=disposable-orm-ci-only psql -h 127.0.0.1 -U lab_orm -d lab_m2_test_native \
            -v ON_ERROR_STOP=1 -c "SELECT current_user"
